<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GL Bajaj Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="site">
        <!-- TOP: logo, college name, links -->
        <div class="logo">
            <img src="library-book-reading-abstract-icon-or-emblem-vector.jpg" alt="GL Bajaj Library Logo" class="logo-img">
        </div>
        <div class="title">
            <h1>GL Bajaj Institute Of Technology</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart</a>
        </nav>
        <!-- LEFT: branch links -->
        <aside>
            <h3>Branches</h3>
            <a href="catalogue.html?branch=CSE" data-branch="CSE">CSE</a>
            <a href="catalogue.html?branch=CSIT" data-branch="CSIT">CSIT</a>
            <a href="catalogue.html?branch=CSAI" data-branch="CSAI">CSAI</a>
            <a href="catalogue.html?branch=ECE" data-branch="ECE">ECE</a>
            <a href="catalogue.html?branch=EEE" data-branch="EEE">EEE</a>
            <a href="catalogue.html?branch=CIVIL" data-branch="CIVIL">CIVIL</a>
        </aside>
        <!-- RIGHT: page content -->
        <main>
            <h2>Student / Faculty Login</h2>
            <form class="box" id="loginForm" novalidate>
                <div id="msg"></div>
                <label class="row">User Name / Email: <input type="text" id="user" placeholder="Enter name or e-mail"></label>
                <label class="row">Password: <input type="password" id="pass" placeholder="Enter password"></label>
                <div class="inline">
                    <input type="submit" value="Login">
                    <input type="reset" value="Reset">
                </div>
                <p>New to library portal? <a href="registration.html">Create an account here</a></p>
            </form>
        </main>
        <!-- FOOTER -->
        <footer>
            <p>&copy; 2024 GL Bajaj Institute of Technology &amp; Management | Department of Computer Science &amp; Engineering</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
